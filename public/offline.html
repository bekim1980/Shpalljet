<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Shpalljet — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0a0a0a;
        color: #e8e4dc;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        border: 1px solid #2a2a2a;
        border-radius: 1rem;
        background: #111;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 0.75rem;
        color: #c9a84c;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #a8a29e;
        margin-bottom: 1.25rem;
      }
      button, a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        background: linear-gradient(135deg, #c9a84c, #a8863a);
        color: #0a0a0a;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Shpalljet needs an internet connection for listings, messages, and sign-in.
        Cached pages may still open; fresh data loads when you're back online.
      </p>
      <button type="button" id="retry">Try again</button>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine) location.href = "/";
        else location.reload();
      });
      window.addEventListener("online", function () { location.href = "/"; });
    </script>
  </body>
</html>
